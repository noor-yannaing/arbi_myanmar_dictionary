name: arabic_myanmar_dictionary
description: An offline Arabic–Myanmar dictionary with full Arabic vowel marks.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/profile/developer.jpeg
    - assets/branding/nur-language-bridge.png
    - AMDText_Alif_Arabic_Myanmar_with_Harakat.json
